name: Kotlin SDK
on:
  push:
    branches: [main]
    tags: ['*']
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - run: gradle test publishSdkPublicationToStagingRepository --no-daemon --max-workers=2
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
          gradle -p android-example assembleDebug --no-daemon --max-workers=2
